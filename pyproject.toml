[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doe-studio"
version = "0.0.1"
description = "화학기업 연구원을 위한 실험계획법(DOE) 도구. Minitab DOE 메뉴와 같은 워크플로·같은 통계 결과를 목표로 한다."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyDOE3>=1.0",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["doe_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
